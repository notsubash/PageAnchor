name: pageanchor

# LanceDB is embedded at LANCEDB_URI (default ./corpus/lancedb).
# No vector database container is required.
# Visual index (ColQwen2): docker compose --profile ingest run --rm ingest bash -lc
#   "uv sync --extra ingest --extra visual && uv run pageanchor ingest --visual --all"

services:
  ingest:
    profiles: ["ingest"]
    image: python:3.11-bookworm
    working_dir: /work
    volumes:
      - ./:/work
    env_file:
      - .env
    environment:
      PAGEANCHOR_CORPUS_ROOT: /work/corpus
      LANCEDB_URI: /work/corpus/lancedb
    command:
      - bash
      - -lc
      - pip install -q uv && uv sync --extra ingest && uv run pageanchor ingest --all
