[project]
name = "pageanchor"
version = "0.1.0"
description = "Visually grounded document Q&A with verifiable page citations."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "lancedb",
    "pymupdf",
    "openai",
    "python-dotenv",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
mcp = ["mcp"]
ingest = ["docling"]
dev = ["pytest", "ruff", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
